<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="QR code link to Amazon registry">
  <title>Registry QR (visual placeholder)</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
